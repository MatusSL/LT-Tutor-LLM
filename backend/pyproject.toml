[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.10",
    "langchain-ollama>=1.0.1",
    "python-multipart>=0.0.20",
    "langchain-mistralai>=1.1.2",
    "langchain-openai>=0.3.0",
    "dotenv>=0.9.9",
    "supabase>=2.28.3",
    "httpx>=0.28.1",
    "bcrypt>=5.0.0",
    "language-tool-python>=3.4.0",
    "lingua-language-detector>=2.2.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.12.5",
    "fastapi[standard]>=0.139.2",
    "psycopg[binary,pool]>=3.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-mock>=3.15.1", "ruff>=0.15.6"]
